# Regenera la web cada vez que cambia un Excel de la carpeta «datos» o la fuente.
# Ejecuta los mismos scripts que antes se lanzaban a mano y sube las páginas resultantes.
# Si algún script falla, no se publica nada: la web se queda como estaba y GitHub avisa por correo.
name: Publicar la web

on:
  push:
    branches: [main]
    paths:
      - "datos/**"
      - "fuente/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch: # botón «Run workflow» en la pestaña Actions para regenerar a mano

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Generar las páginas desde los Excel
        env:
          TZ: Europe/Madrid
        run: |
          set -o pipefail
          export FECHA=$(date +%F)
          mkdir -p _trabajo
          cp fuente/fuente-una-pagina.html _trabajo/fuente.html
          {
            python fuente/build_medios.py datos/linkedin_actualizable.xlsx _trabajo/fuente.html
            python fuente/build_docencia.py datos/docencia_actualizable.xlsx _trabajo/fuente.html
            python fuente/build_pages.py _trabajo/fuente.html _trabajo/dist
          } 2>&1 | tee _trabajo/registro.txt
          if grep -q "AVISO" _trabajo/registro.txt; then
            { echo "### Avisos de los scripts"; echo; grep "AVISO" _trabajo/registro.txt | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin avisos." >> "$GITHUB_STEP_SUMMARY"
          fi
          cp _trabajo/dist/index.html _trabajo/dist/proyectos.html _trabajo/dist/cv.html \
             _trabajo/dist/privacidad.html _trabajo/dist/sitemap.xml _trabajo/dist/robots.txt .
          rm -rf _trabajo

      - name: Subir las páginas generadas
        id: subir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html proyectos.html cv.html privacidad.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Las páginas no cambian." >> "$GITHUB_STEP_SUMMARY"
            echo "cambios=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Web regenerada desde los Excel ($(TZ=Europe/Madrid date +'%d/%m/%Y %H:%M'))"
            git push
            echo "Páginas actualizadas y publicadas." >> "$GITHUB_STEP_SUMMARY"
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir a GitHub Pages que publique
        if: steps.subir.outputs.cambios == 'si'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
